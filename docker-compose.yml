services:
  # Desarrollo: Vite con hot reload
  # Uso: docker compose up web
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Producción: build estático + nginx
  # Uso: docker compose up web-prod --build
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  web_node_modules:
