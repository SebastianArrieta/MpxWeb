# Publica el sitio en GitHub Pages en cada push a main.
#
# Requisito (una sola vez, lo hace quien administra el repo):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Dirección resultante: https://sebastianarrieta.github.io/MpxWeb/
# Para usar un dominio propio, define en Settings → Secrets and variables →
# Actions → Variables:  SITE_URL=https://tu-dominio.com  y  BASE_PATH=/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_FORMSPREE_ENDPOINT: ${{ vars.FORMSPREE_ENDPOINT }}
        run: |
          # Por defecto: https://<owner en minúsculas>.github.io/<repo>/
          export VITE_BASE="${BASE_PATH:-/$REPO/}"
          export VITE_SITE_URL="${SITE_URL:-https://${OWNER,,}.github.io/$REPO}"
          echo "Publicando en $VITE_SITE_URL (base $VITE_BASE)"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
