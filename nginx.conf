server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  # Worker de MapLibre (.mjs): debe servirse como JavaScript para que el
  # navegador acepte el módulo (algunas versiones de nginx no conocen .mjs).
  location ~* \.mjs$ {
    types {}
    default_type application/javascript;
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
